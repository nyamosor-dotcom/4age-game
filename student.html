<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ирээдүйн аврагчид - Тоглоом</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #a8ede7 0%, #fed6e3 100%); font-family: 'Comic Sans MS', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #game-container { width: 100%; max-width: 800px; height: 100%; max-height: 700px; background: #ffffff; position: relative; overflow: hidden; display: flex; flex-direction: column; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #ffffff; z-index: 10; padding: 20px; text-align: center; }
        .screen.hidden { display: none !important; }
        h1 { color: #ff6f00; font-size: 2rem; margin-bottom: 10px; text-shadow: 1px 1px 0px #ffe082;}
        input[type="text"] { padding: 15px; font-size: 1.5rem; border: 4px solid #ab47bc; border-radius: 30px; text-align: center; width: 80%; margin-bottom: 20px; outline:none; color:#333;}
        .btn { background: #66bb6a; color: white; border: none; padding: 15px 40px; font-size: 1.5rem; border-radius: 30px; cursor: pointer; font-weight: bold; box-shadow: 0 5px 0 #388e3c;}
        .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #388e3c; }
        #game-header { display: flex; justify-content: space-between; padding: 15px 20px; background: #fff8e1; font-weight: bold; color: #f57f17; z-index: 5; font-size: 1.2rem; border-bottom: 3px dashed #ffe082;}
        #play-area { flex: 1; position: relative; background: linear-gradient(to bottom, #e1f5fe, #ffffff); overflow: hidden; width: 100%; }
        .falling-shape { position: absolute; top: -70px; width: 70px; height: 70px; display: flex; justify-content: center; align-items: center; font-size: 55px; z-index: 4; }
        #controls-panel { height: 130px; background: #ede7f6; border-top: 4px solid #d1c4e9; display: flex; justify-content: space-around; align-items: center; z-index: 5; }
        .target-btn { width: 95px; height: 95px; border-radius: 20px; border: 4px solid #fff; display: flex; justify-content: center; align-items: center; font-size: 50px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.15); transition: transform 0.1s;}
        .target-btn:active { transform: scale(0.9); }
        #btn-1 { background: #ff7043; }
        #btn-2 { background: #ab47bc; }
        #btn-3 { background: #26a69a; }
        .floating-feedback { position: absolute; font-size: 60px; z-index: 10; animation: floatUp 0.8s forwards; pointer-events: none;}
        @keyframes floatUp { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1) translateY(-60px); opacity: 0; } }
        .result-badges { display: flex; gap: 15px; margin: 20px 0; font-size: 35px; }
        .badge-box { background: #fff9c4; padding: 15px 20px; border-radius: 15px; border: 3px solid #fbc02d; text-align: center; }
        .teacher-signature { position: absolute; bottom: 15px; font-size: 1rem; color: #7b1fa2; font-weight: bold; background: #f3e5f5; padding: 6px 14px; border-radius: 12px; border: 2px dashed #ab47bc; }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 1. Start Screen -->
        <div id="start-screen" class="screen">
            <h1>⭐ Ирээдүйн аврагчид ⭐</h1>
            <p style="color:#666; margin-bottom:20px; font-size:1.1rem;">Дүрс таних хөгжилтэй мини тоглоом</p>
            <input type="text" id="player-name" placeholder="Хүүхдийн нэр..." maxlength="15" autocomplete="off">
            <button class="btn" onclick="startGame()">Эхлэх 🚀</button>
            <div class="teacher-signature">Бүлгийн багш: А.Ням-Осор</div>
        </div>

        <!-- 2. Game Screen -->
        <div id="game-screen" class="screen hidden" style="padding:0; justify-content: flex-start;">
            <div id="game-header">
                <span id="display-name">Нэр: -</span>
                <span id="progress-text">1 / 10</span>
            </div>
            <div id="play-area"></div>
            <div id="controls-panel">
                <div class="target-btn" id="btn-1" onclick="handleInput(0)"><span id="icon-1">🔴</span></div>
                <div class="target-btn" id="btn-2" onclick="handleInput(1)"><span id="icon-2">🔺</span></div>
                <div class="target-btn" id="btn-3" onclick="handleInput(2)"><span id="icon-3">🟩</span></div>
            </div>
        </div>

        <!-- 3. Result Screen -->
        <div id="result-screen" class="screen hidden">
            <div id="result-emoji" style="font-size: 70px; margin-bottom: 10px;">👑</div>
            <h1 id="result-title">Амжилттай дууслаа!</h1>
            <p id="result-name-display" style="font-size: 1.4rem; font-weight: bold; color: #7b1fa2; margin-bottom: 10px;"></p>
            <div class="result-badges">
                <div class="badge-box">⭐<br><span id="score-stars" style="color:#d84315; font-weight:bold;">0</span></div>
                <div class="badge-box">🟢<br><span id="score-correct" style="color:#d84315; font-weight:bold;">0</span></div>
                <div class="badge-box">❌<br><span id="score-wrong" style="color:#d84315; font-weight:bold;">0</span></div>
            </div>
            <button class="btn" onclick="resetGame()">Дахин тоглох 🔄</button>
            <p id="sync-status" style="margin-top:15px; font-size:0.95rem; font-weight:bold; color:#ab47bc;"></p>
        </div>
    </div>

    <script>
        let customShapes = JSON.parse(localStorage.getItem('shapeGameShapes') || '["🔴","🔺","🟩"]');

        window.onload = () => {
            document.getElementById('icon-1').innerText = customShapes[0];
            document.getElementById('icon-2').innerText = customShapes[1];
            document.getElementById('icon-3').innerText = customShapes[2];
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(1000, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        let playerName = "", currentShapeIndex = 0, score = 0, wrongCount = 0;
        let currentActiveShape = null, fallInterval = null, isAnswered = false;
        const totalShapes = 10;

        function startGame() {
            playerName = document.getElementById('player-name').value.trim();
            if (!playerName) { alert("Нэрээ бичнэ үү!"); return; }
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('display-name').innerText = `Нэр: ${playerName}`;
            currentShapeIndex = 0; score = 0; wrongCount = 0;
            nextShape();
        }

        function nextShape() {
            if (currentShapeIndex >= totalShapes) { endGame(); return; }
            currentShapeIndex++;
            document.getElementById('progress-text').innerText = `${currentShapeIndex} / ${totalShapes}`;
            isAnswered = false;

            const playArea = document.getElementById('play-area');
            if (currentActiveShape && currentActiveShape.element) currentActiveShape.element.remove();

            const correctIndex = Math.floor(Math.random() * 3);
            const shapeEl = document.createElement('div');
            shapeEl.className = 'falling-shape';
            shapeEl.innerText = customShapes[correctIndex];
            
            const maxW = playArea.clientWidth > 0 ? playArea.clientWidth - 80 : 300;
            const randomX = Math.floor(Math.random() * maxW) + 10;
            shapeEl.style.left = randomX + 'px';
            shapeEl.style.top = '-70px';

            playArea.appendChild(shapeEl);
            currentActiveShape = { index: correctIndex, element: shapeEl, y: -70 };

            const targetHeight = (playArea.clientHeight > 0 ? playArea.clientHeight : 400) - 80;
            const fallSpeed = 3.5;

            if (fallInterval) clearInterval(fallInterval);
            fallInterval = setInterval(() => {
                if (isAnswered) { clearInterval(fallInterval); return; }
                currentActiveShape.y += fallSpeed;
                currentActiveShape.element.style.top = currentActiveShape.y + 'px';
                if (currentActiveShape.y >= targetHeight) {
                    clearInterval(fallInterval);
                    handleInput(-1); // missed
                }
            }, 20);
        }

        function handleInput(selectedIndex) {
            if (isAnswered) return;
            isAnswered = true;
            if (fallInterval) clearInterval(fallInterval);

            const playArea = document.getElementById('play-area');
            const feedbackEl = document.createElement('div');
            feedbackEl.className = 'floating-feedback';
            
            if(currentActiveShape && currentActiveShape.element){
                feedbackEl.style.left = currentActiveShape.element.style.left;
                feedbackEl.style.top = currentActiveShape.element.style.top;
            } else {
                 feedbackEl.style.left = '50px'; feedbackEl.style.top = '200px';
            }

            if (selectedIndex === currentActiveShape.index) {
                score++; playSound('correct'); feedbackEl.innerText = '✔️';
            } else {
                wrongCount++; playSound('wrong'); feedbackEl.innerText = '❌';
            }

            playArea.appendChild(feedbackEl);
            if (currentActiveShape && currentActiveShape.element) currentActiveShape.element.remove();
            setTimeout(() => { feedbackEl.remove(); nextShape(); }, 500);
        }

        function endGame() {
            if (fallInterval) clearInterval(fallInterval);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            document.getElementById('result-name-display').innerText = `${playerName}, сайн байлаа! 🎉`;
            document.getElementById('score-stars').innerText = score;
            document.getElementById('score-correct').innerText = score;
            document.getElementById('score-wrong').innerText = wrongCount;

            document.getElementById('result-emoji').innerText = score >= 8 ? "👑" : (score >= 5 ? "🌟" : "⭐");
            playSound('correct');

            // Save score to shared browser storage safely
            try {
                let existingScores = JSON.parse(localStorage.getItem('shapeGameCloudScores') || '[]');
                existingScores.push({ name: playerName, score: score, wrong: wrongCount, date: new Date().toLocaleDateString() });
                localStorage.setItem('shapeGameCloudScores', JSON.stringify(existingScores));
                document.getElementById('sync-status').innerText = "✅ Дүн амжилттай бүртгэгдлээ!";
            } catch(e) {
                document.getElementById('sync-status').innerText = "⚠️ Хадгалахад алдаа гарлаа.";
            }
        }

        function resetGame() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('player-name').value = '';
            document.getElementById('sync-status').innerText = '';
        }
    </script>
</body>
</html>
